name: Deploy BioSaúde Farma — CI/CD

# Dispara o pipeline a cada push na branch main
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy na instância EC2

    steps:
      # Passo 1: Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v3

      # Passo 2: Conecta na EC2 via SSH e executa o deploy
      - name: Deploy via SSH na EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
      
            # Garante que a pasta existe na EC2
            mkdir -p ~/biosaude
            cd ~/biosaude
  
            # Remove arquivos velhos locais
            rm -f index.html Dockerfile
  
            # Baixa os arquivos limpos e atualizados direto do seu GitHub público
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/main/index.html
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/main/Dockerfile
  
            # Para e deleta o container antigo se ele existir
            sudo docker stop container-biosaude || true
            sudo docker rm container-biosaude || true
  
            # Compila a nova imagem com o Dockerfile atualizado
            sudo docker build -t biosaude-app .
  
            # Inicializa o container Docker na porta 80 do seu servidor
            sudo docker run -d -p 80:80 --name container-biosaude biosaude-app
